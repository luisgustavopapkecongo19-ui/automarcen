<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>AutoMarcen</title>
<meta name="theme-color" content="#15181d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="AutoMarcen: projeto de marcenaria no celular e no tablet. Desenho, 3D, lista de peças, plano de corte e orçamento.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: estação CAD de tela única — barra superior com abas (Desenho, 3D, Peças, Orçamento); no Desenho, trilho de ferramentas, prancheta e painel de propriedades */
:root{
  --bg:#f3f4f6; --surface:#ffffff; --surface-2:#f1f2f5; --surface-3:#e8eaee;
  --fg:#15181c; --muted:#646a74; --line:#e3e5e9; --line-2:#cdd1d8;
  --accent:#e2580b; --accent-fg:#ffffff; --accent-soft:#fdeee4;
  --ok:#15803d; --warn:#b45309; --danger:#cf2e22;
  --cv-bg:#fbfbfc; --cv-minor:#eef0f3; --cv-major:#dfe2e7; --cv-ink:#1a1d22; --cv-axis:#b9bfc8; --snap:#0e9f6e; --win:#2563eb;
  --font:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --shadow:0 1px 2px rgba(16,20,26,.06),0 6px 20px rgba(16,20,26,.08);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]):not([data-ui="light"]){
  --bg:#0e1013; --surface:#16191e; --surface-2:#1d2026; --surface-3:#262a31;
  --fg:#e9ecf0; --muted:#959ca7; --line:#252930; --line-2:#343a43;
  --accent:#ff7b32; --accent-fg:#1c0d03; --accent-soft:#2d1b10;
  --ok:#4ade80; --warn:#fbbf24; --danger:#ff6b5e;
  --cv-bg:#101317; --cv-minor:#191d23; --cv-major:#242931; --cv-ink:#e7eaef; --cv-axis:#3a414b; --snap:#34d399; --win:#60a5fa;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]:not([data-ui="light"]),:root[data-ui="dark"]{
  --bg:#0e1013; --surface:#16191e; --surface-2:#1d2026; --surface-3:#262a31;
  --fg:#e9ecf0; --muted:#959ca7; --line:#252930; --line-2:#343a43;
  --accent:#ff7b32; --accent-fg:#1c0d03; --accent-soft:#2d1b10;
  --ok:#4ade80; --warn:#fbbf24; --danger:#ff6b5e;
  --cv-bg:#101317; --cv-minor:#191d23; --cv-major:#242931; --cv-ink:#e7eaef; --cv-axis:#3a414b; --snap:#34d399; --win:#60a5fa;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;overflow:hidden;background:var(--bg);color:var(--fg);font:calc(14px*var(--fs,1))/1.45 var(--font);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{height:100%;display:grid;grid-template-rows:auto 1fr}

/* barra superior */
.top{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap;min-width:0}
.brand{width:30px;height:30px;border-radius:8px;background:var(--fg);color:var(--bg);display:grid;place-items:center;flex:none}
.brand svg{width:18px;height:18px}
.proj{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:8px;font-weight:600;min-width:0;max-width:240px}
.proj span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proj:hover{background:var(--surface-2)}
.views{display:flex;gap:2px;background:var(--surface-2);padding:3px;border-radius:10px;margin-inline:auto}
.views button{padding:6px 14px;border-radius:8px;font-weight:500;color:var(--muted);font-size:calc(13px*var(--fs,1));white-space:nowrap}
.views button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.acts{display:flex;gap:2px}
.ib{width:36px;height:36px;display:grid;place-items:center;border-radius:8px;color:var(--fg)}
.ib:hover{background:var(--surface-2)}
a.ib{text-decoration:none}
.ib:disabled{opacity:.3;cursor:default}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:9px;font-weight:600;border:1px solid var(--line-2);background:var(--surface);font-size:calc(13px*var(--fs,1));white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.pri:hover{filter:brightness(1.05)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.del{color:var(--danger)}
.btn.sm{padding:5px 10px;font-size:calc(12px*var(--fs,1))}
@media (max-width:760px){.views{order:3;width:100%;margin:0}.views button{flex:1;padding:6px 4px}.proj{max-width:none;flex:1}}

main{position:relative;min-height:0}
.view{position:absolute;inset:0}

/* desenho */
#v-draw{display:grid;grid-template-columns:60px minmax(0,1fr) 312px}
.rail{display:flex;flex-direction:column;gap:2px;padding:8px;background:var(--surface);border-right:1px solid var(--line);overflow:auto;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail hr{border:0;border-top:1px solid var(--line);margin:6px 4px;width:auto}
.tb{width:44px;height:44px;display:grid;place-items:center;border-radius:10px;color:var(--muted);position:relative;flex:none}
.tb:hover{background:var(--surface-2);color:var(--fg)}
.tb[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.tb .tl{display:none}
.tb kbd{position:absolute;right:3px;bottom:2px;font:500 calc(9px*var(--fs,1)) var(--mono);color:var(--muted);opacity:.7}
.tb.cta{color:var(--accent)}
.stage{position:relative;min-width:0;min-height:0;background:var(--cv-bg);overflow:hidden}
#cv{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
#cv.sel{cursor:default}#cv.pan{cursor:grab}

.hud{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:5px 6px 5px 12px;box-shadow:var(--shadow);max-width:calc(100% - 20px);flex-wrap:wrap;justify-content:center}
.hud .msg{font-size:calc(13px*var(--fs,1));font-weight:500}
.hud .rd{font:500 calc(12px*var(--fs,1)) var(--mono);color:var(--accent);font-variant-numeric:tabular-nums}
.num{display:flex;align-items:center;gap:4px}
.num input{width:120px;font:500 calc(14px*var(--fs,1)) var(--mono);padding:5px 8px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface-2);color:var(--fg)}
.status{position:absolute;left:8px;right:8px;bottom:8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;pointer-events:none}
.status>*{pointer-events:auto}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 9px;font:500 calc(11px*var(--fs,1)) var(--mono);color:var(--muted);letter-spacing:.02em;font-variant-numeric:tabular-nums}
button.chip:hover{color:var(--fg)}
.chip[aria-pressed="true"]{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.spacer{flex:1;pointer-events:none}
.ctx{position:absolute;left:50%;bottom:50px;transform:translateX(-50%);display:flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;box-shadow:var(--shadow);max-width:calc(100% - 16px);overflow-x:auto;scrollbar-width:none}
.ctx::-webkit-scrollbar{display:none}
.ctx .go{color:var(--accent);font-weight:600}
.ctx button{display:flex;align-items:center;gap:6px;padding:7px 10px;border-radius:8px;font-size:calc(13px*var(--fs,1));font-weight:500;white-space:nowrap}
.ctx button:hover{background:var(--surface-2)}
.ctx .del{color:var(--danger)}

/* painel lateral */
.side{background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.ptabs{display:flex;gap:2px;padding:8px 10px 0;border-bottom:1px solid var(--line);align-items:center}
.ptabs button{padding:8px 10px;font-weight:600;font-size:calc(13px*var(--fs,1));color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.ptabs button[aria-selected="true"]{color:var(--fg);border-color:var(--accent)}
.ptabs .x{margin-left:auto;display:none}
.pbody{overflow:auto;padding:14px;display:grid;gap:14px;align-content:start;-webkit-user-select:text;user-select:text}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ph h3{margin:0;font-size:calc(15px*var(--fs,1))}
.tag{font:500 calc(10px*var(--fs,1)) var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--surface-2);padding:3px 6px;border-radius:5px}
.grp{display:grid;gap:10px}
.grp>.lb{margin-bottom:-4px}
.lb{font-size:calc(11px*var(--fs,1));font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.f{display:grid;gap:4px;min-width:0}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.r3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.in{width:100%;min-width:0;font:500 calc(13px*var(--fs,1)) var(--font);padding:7px 9px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);color:var(--fg)}
.in.n{font-family:var(--mono);font-variant-numeric:tabular-nums}
textarea.in{resize:vertical;min-height:60px}
.unit{position:relative}
.unit .in{padding-right:30px}
.unit em{position:absolute;right:8px;top:50%;transform:translateY(-50%);font:normal 11px var(--mono);color:var(--muted);pointer-events:none}
.sws{display:flex;flex-wrap:wrap;gap:6px}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line-2);position:relative;flex:none}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--fg)}
.sw.layer{background:conic-gradient(from 45deg,var(--cv-ink) 0 50%,var(--surface-3) 0)}
.sw.auto{background:var(--cv-ink)}
.sw.custom{background:conic-gradient(#ef4444,#f59e0b,#22c55e,#3b82f6,#a855f7,#ef4444)}
.sw input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.fin{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.fin button{aspect-ratio:1;border-radius:8px;border:1px solid var(--line-2);max-width:100%}
.fin button[aria-pressed="true"]{outline:2px solid var(--fg);outline-offset:2px}
.seg{display:flex;background:var(--surface-2);border-radius:9px;padding:3px;gap:2px}
.seg button{flex:1;padding:5px 8px;border-radius:7px;font-size:calc(12px*var(--fs,1));font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.secs{display:grid;gap:6px}
.sec{display:grid;grid-template-columns:18px 64px 1fr 46px 28px;gap:5px;align-items:center}
.sec .k{font:500 calc(11px*var(--fs,1)) var(--mono);color:var(--muted)}
.sec .in{padding:6px 6px;font-size:calc(12px*var(--fs,1))}
.note{font-size:calc(12px*var(--fs,1));color:var(--muted);margin:0}
.warn{font-size:calc(12px*var(--fs,1));color:var(--warn);margin:0}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:calc(13px*var(--fs,1))}
.kv b{font-family:var(--mono);font-weight:500;text-align:right;font-variant-numeric:tabular-nums}
.layers{display:grid;gap:4px}
.lay{display:grid;grid-template-columns:auto 1fr auto auto;gap:6px;align-items:center;padding:4px 4px 4px 8px;border-radius:9px;border:1px solid transparent}
.lay.cur{border-color:var(--accent);background:var(--accent-soft)}
.lay .nm{text-align:left;padding:6px 0;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lay .ib{width:30px;height:30px;color:var(--muted)}
.lay .ib[aria-pressed="false"]{opacity:.35}
.dot{width:14px;height:14px;border-radius:4px;position:relative;box-shadow:0 0 0 1px var(--line-2)}
.dot input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}

@media (max-width:900px){
  #v-draw{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
  .rail{flex-direction:row;order:2;border-right:0;border-top:1px solid var(--line);padding:4px 6px calc(4px + env(safe-area-inset-bottom,0px));gap:0}
  .rail hr{border-top:0;border-left:1px solid var(--line);margin:8px 4px;align-self:stretch}
  .tb{flex:1 0 54px;width:auto;height:52px;gap:0;align-content:center}
  .tb .tl{display:block;font-size:calc(10px*var(--fs,1));font-weight:500;margin-top:1px}
  .tb kbd{display:none}
  .side{position:absolute;left:0;right:0;bottom:0;max-height:64%;border:1px solid var(--line);border-radius:16px 16px 0 0;box-shadow:var(--shadow);transform:translateY(102%);transition:transform .22s ease;z-index:6}
  .side.open{transform:none}
  .ptabs .x{display:grid}
  .pbody{padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
  .ctx{bottom:46px}
  .hud{top:8px}
  .hide-m{display:none}
}
@media (min-width:901px){.only-m{display:none!important}}

/* 3D */
#v-3d .stage{position:absolute;inset:0;background:linear-gradient(var(--surface-2),var(--bg))}
#c3d{display:block;width:100%;height:100%;touch-action:none}
.float{position:absolute;display:flex;gap:6px;flex-wrap:wrap}
.empty{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center}
.empty div{max-width:340px;display:grid;gap:10px;justify-items:center}
.empty h3{margin:0;font-size:calc(17px*var(--fs,1))}
.empty p{margin:0;color:var(--muted)}

/* páginas */
.page{height:100%;overflow:auto;padding-inline:16px;padding-block:20px 48px;-webkit-user-select:text;user-select:text}
.wrap{max-width:1120px;margin:0 auto;display:grid;gap:18px}
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.phead h1{margin:0;font-size:calc(22px*var(--fs,1));letter-spacing:-.01em;text-wrap:balance}
.phead p{margin:2px 0 0;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card h2{margin:0 0 12px;font-size:calc(15px*var(--fs,1))}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:2px}
.tile .v{font:600 calc(20px*var(--fs,1)) var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tile .s{font-size:calc(12px*var(--fs,1));color:var(--muted)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:calc(13px*var(--fs,1));font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:calc(11px*var(--fs,1));letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--surface)}
td.n,th.n{text-align:right;font-family:var(--mono)}
td.code{font:600 calc(12px*var(--fs,1)) var(--mono)}
.sheets{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.sheetc{display:grid;gap:6px}
.sheetc .cap{display:flex;justify-content:space-between;font-size:calc(12px*var(--fs,1));color:var(--muted)}
.sheet-svg{width:100%;height:auto;display:block;border-radius:6px;color:var(--ok)}
.h3{font-size:calc(13px*var(--fs,1));margin:12px 0 8px}.holes{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-bottom:8px}.hole{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px}.hole>div{display:grid;gap:2px;min-width:0}.hole b{font-size:calc(13px*var(--fs,1))}
.stt{font-weight:600}.st-aprovado{color:var(--ok)}.st-recusado{color:var(--danger)}.st-enviado{color:var(--warn)}
.quick2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.quick2 .btn{padding:12px 10px;white-space:normal}
.photo{cursor:pointer;justify-self:start}.spimg{max-height:220px;object-fit:contain;border:1px solid var(--line);border-radius:10px;background:#fff}
.spin{display:flex;gap:8px;align-items:stretch}.spin textarea{flex:1;resize:vertical}.spin .btn{flex-direction:column;gap:2px;min-width:72px}.spin .btn.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.splist{margin:6px 0;padding-left:18px;display:grid;gap:4px;font-size:calc(13px*var(--fs,1))}
.grains{display:grid;gap:6px;margin-top:10px}.chk{display:flex;gap:8px;align-items:center;font-size:calc(13px*var(--fs,1))}.chk input{width:18px;height:18px;accent-color:var(--accent)}.chk small{color:var(--muted)}
.sheet-svg .bg{fill:var(--surface-2);stroke:var(--line-2)}
.sheet-svg .pc{stroke:var(--cv-ink);stroke-opacity:.55}
.sheet-svg text{fill:#1a1d22;font-family:var(--mono)}
.sheet-svg .off{fill:url(#hatch);stroke:var(--ok);stroke-dasharray:6 4}
.sheet-svg text.offt{fill:var(--ok)}
.qgrid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.qgrid{grid-template-columns:1fr}}
.sticky{position:sticky;top:0}
.qline{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:9px 0;border-bottom:1px solid var(--line)}
.qline small{color:var(--muted);grid-column:1}
.qline b{font:500 calc(14px*var(--fs,1)) var(--mono);grid-row:1/3;grid-column:2;align-self:center;font-variant-numeric:tabular-nums}
.qmiss{display:grid;gap:2px;margin:6px 0 4px;padding:10px 12px;border-radius:10px;color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent);font-size:calc(13px*var(--fs,1))}
.qmiss span{color:var(--fg)}
.qline.qzero b{color:var(--warn);font-family:inherit;font-weight:600}
.in.need{border-color:var(--warn);box-shadow:0 0 0 2px color-mix(in srgb,var(--warn) 25%,transparent)}
.qtotal{display:flex;justify-content:space-between;align-items:baseline;padding-top:12px}
.qtotal b{font:600 calc(26px*var(--fs,1)) var(--mono);letter-spacing:-.02em;color:var(--accent);font-variant-numeric:tabular-nums}
@media (max-width:600px){.mrow{grid-template-columns:1fr 1fr!important}.mrow>:first-child{grid-column:1/-1}}
.badge{display:inline-block;font-size:calc(11px*var(--fs,1));font-weight:600;color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent);padding:2px 8px;border-radius:999px}

/* folhas modais */
.scrim{position:fixed;inset:0;background:rgba(10,12,16,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
@media (min-width:700px){.scrim{align-items:center}}
.dlg{background:var(--surface);width:100%;max-width:540px;max-height:88%;overflow:auto;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;-webkit-user-select:text;user-select:text;box-shadow:var(--shadow)}
@media (min-width:700px){.dlg{border-radius:18px}}
.dlg h2{margin:0;font-size:calc(18px*var(--fs,1))}
.dlg p{margin:0;color:var(--muted)}
.row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.list{display:grid;gap:6px}
.li{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;width:100%}
.li:hover{background:var(--surface-2)}
.li.on{border-color:var(--accent)}
.li .t{flex:1;min-width:0}

/* geometria paramétrica de um módulo (mm). x: esq→dir, y: piso→topo, z: fundo→frente */
function modGeom(m){

  add("Lateral",2,sideH,D,"caixa",sideH);

  r2d.push({x:0,y:0,w:W,h:H,fill:"body",lw:1.6});
  r2d.push({x:0,y:H-t,w:W,h:t,fill:"body"});
  if(pl>0) r2d.push({x:t,y:0,w:Wi,h:pl,fill:null});
  const yb=pl+t, yt=H-t, hIn=yt-yb, Din=D-tb;
  const list=m.secs&&m.secs.length?m.secs:[{w:0,type:"porta"}];
  const n=list.length, avail=Wi-(n-1)*t;
  let fixed=0,autos=0; list.forEach(s=>{if(+s.w>0)fixed+=s.w*10;else autos++});
  let ws=list.map(s=>+s.w>0?s.w*10:0);

  else if(Math.abs(fixed-avail)>0.5){ws[n-1]+=avail-fixed; warn=`O último vão foi ajustado para ${num(ws[n-1]/10)} cm para fechar a largura.`}

    const hid=s.type!=="nicho"?1:0;
    const shelves=(cnt)=>{
      for(let k=1;k<=cnt;k++){const ys=yb+k*hIn/(cnt+1)-t/2; B(a,ys,tb,w,t,Din-20,"inner"); r2d.push({x:a,y:ys,w,h:t,fill:"body",int:hid})}

      let fix=0,au=0; Z.forEach(z=>{if(+z.h>0) fix+=z.h*10; else au++});

            B(a+13+t,yy+15,zb,bw-2*t,bh,t,"inner",o); B(a+13,yy+15,zb,bw,6,sl,"back",o);
            B(a+w/2-45,yy+dh-28,zf+t,90,10,4,"metal",o);

        } else {
          for(let k=1;k<=cnt;k++){const ys=z0+k*zh/(cnt+1)-t/2; B(a,ys,tb,w,t,Din-20,"inner"); r2d.push({x:a,y:ys,w,h:t,fill:"body",int:hid})}
          add("Prateleira",cnt,w-2,Din-20,"caixa",w-2);

        y=z1;
        if(zi<nz-1){B(a,y,tb,w,t,Din,"inner"); r2d.push({x:a,y,w,h:t,fill:"body",int:hid}); nFix++; y+=t}
      });

    };
    const hasInt=Array.isArray(s.int)&&s.int.some(z=>z&&z.t);
    // puxador conforme o estilo do móvel. dir "h": no topo da frente (gaveta); "v": na borda de abrir (porta)
    const pullOn=(x0,y0,w0,h0,o,f2,dir,zf,side,hy,hl)=>{
      const zz=zf+tf, fl=Object.assign({lw:.6},f2);
      if(PS==="nenhum"){hw.push++; return}

        const sw=PS==="cava"?22:20, kind=PS==="cava"?"groove":"metal", dz=PS==="cava"?-8:0, dd=PS==="cava"?8:16;
        if(dir==="h"){B(x0,y0+h0-sw,zz+dz,w0,sw,dd,kind,o); r2d.push(Object.assign({x:x0,y:y0+h0-sw,w:w0,h:sw,fill:PS==="cava"?"groove":"ink"},fl)); if(PS==="perfil") hw.perfil+=w0/1000}
        else {const xs=side==="R"?x0+w0-sw:x0; B(xs,y0,zz+dz,sw,h0,dd,kind,o); r2d.push(Object.assign({x:xs,y:y0,w:sw,h:h0,fill:PS==="cava"?"groove":"ink"},fl)); if(PS==="perfil") hw.perfil+=h0/1000}

      }

        const pw=Math.min(160,w0*.45); B(x0+w0/2-pw/2,y0+h0-45,zz,pw,12,14,"metal",o); r2d.push(Object.assign({x:x0+w0/2-pw/2,y:y0+h0-45,w:pw,h:12,fill:"ink"},fl));
      } else {

    };

    const drawerFronts=(y0,tot,k,hsA,tag)=>{

      const sum=hsOk?hsA.reduce((a2,b2)=>a2+(+b2),0):k, sl=Math.max(250,Math.floor((Din-20)/50)*50), bw=w-26, hs=[];

        pullOn(lx,y0,lw,h,dr,{door:1},"v",D,hingeLeft?"R":"L",hy,hl);
        l2d.push({x1:hs,y1:y0,x2:hx,y2:y0+h/2,dash:1,door:1},{x1:hs,y1:y0+h,x2:hx,y2:y0+h/2,dash:1,door:1});
        const nh=hingeCount(h); hw.hinge+=nh;

      r2d.push({x:a,y:yb,w,h:hIn,fill:null}); if(hasInt) interior(); else shelves(q);
    } else if(s.type==="gavetas"){

}

/* plano de corte: guilhotina (cortes de ponta a ponta). Testa várias ordens e regras de corte e fica com o
   melhor resultado (menos chapas, depois a maior sobra aproveitável). Com veio, a peça não gira: o
   comprimento (L) acompanha o comprimento da chapa. */
const OFF_MIN=[300,150]; // sobra aproveitável: pelo menos 30 × 15 cm
function packOnce(items,S,grain,rule){
  const tr=+S.trim||0, k=+S.kerf||0, UW=S.w-2*tr, UH=S.h-2*tr;
  const sheets=[], over=[], md=Math.min(...items.map(p=>Math.min(p.L,p.W)),OFF_MIN[1]); // retalho menor que isso não serve para nada
  const orients=p=>grain?[[p.L,p.W,false]]:[[p.L,p.W,false],[p.W,p.L,true]];
  const fitIn=(sh,p)=>{let best=null;
    for(const f of sh.free) for(const [w,h,r] of orients(p)){
      if(w<=f.w&&h<=f.h){const ss=Math.min(f.w-w,f.h-h), ls=Math.max(f.w-w,f.h-h), sc=rule===2?f.w*f.h:ss; if(!best||sc<best.sc||(sc===best.sc&&ls<best.ls)) best={f,w,h,r,sc,ls}}
    } return best};
  for(const p of items){
    if(!orients(p).some(([w,h])=>w<=UW&&h<=UH)){over.push(p);continue}
    let best=null,bs=null;
    for(const sh of sheets){const b=fitIn(sh,p); if(b&&(!best||b.sc<best.sc)){best=b;bs=sh}}
    if(!best){bs={free:[{x:0,y:0,w:UW,h:UH}],pieces:[]}; sheets.push(bs); best=fitIn(bs,p)}
    const {f,w,h,r}=best;
    bs.pieces.push(Object.assign({},p,{x:f.x+tr,y:f.y+tr,w,h,rot:r}));
    bs.free.splice(bs.free.indexOf(f),1);
    const rw=f.w-w-k, rh=f.h-h-k;
    const vert=rule===1?true:(f.w-w<f.h-h); // 1: sempre corte longitudinal primeiro (faixas)
    const add=(r)=>{if(r.w>=md&&r.h>=md) bs.free.push(r)};
    if(vert){ if(rw>0) add({x:f.x+w+k,y:f.y,w:rw,h:h}); if(rh>0) add({x:f.x,y:f.y+h+k,w:f.w,h:rh}) }
    else { if(rw>0) add({x:f.x+w+k,y:f.y,w:rw,h:f.h}); if(rh>0) add({x:f.x,y:f.y+h+k,w:w,h:rh}) }
  }
  const used=sheets.reduce((a,sh)=>a+sh.pieces.reduce((b,p)=>b+p.w*p.h,0),0);
  for(const sh of sheets){
    sh.off=sh.free.filter(f=>Math.max(f.w,f.h)>=OFF_MIN[0]&&Math.min(f.w,f.h)>=OFF_MIN[1]).map(f=>({x:f.x+tr,y:f.y+tr,w:Math.floor(f.w),h:Math.floor(f.h)})).sort((a,b)=>b.w*b.h-a.w*a.h);
    delete sh.free;

async function cloudFlush(){
  if(!SV.col||SV.cloud!=="on"||!SV.synced) return;
  if(!online()) return; // sem internet: fica no aparelho e sobe quando a conexão voltar
  if(SV.busy){SV.again=true; return}
  SV.busy=true; updSave();
  try{
    while(SV.dirty.size||SV.dead.size){
      if(SV.dead.size){const pid=[...SV.dead][0]; await writeTomb(pid); SV.dead.delete(pid); continue}
      const pid=[...SV.dirty][0]; SV.dirty.delete(pid);
      const pr=store.projects.find(x=>x.id===pid); if(!pr||pr.sample) continue;
      try{await writeProject(pr)}catch(e){SV.dirty.add(pid); throw e}
    }
    SV.err=null;
  }catch(e){
    const code=(e&&e.code)||"unavailable"; SV.err=code;
    if(["invalid_argument","not_granted","revoked","capability_disabled","capability_removed","transform_error","permission-denied","unauthenticated","invalid-argument"].includes(code)){SV.cloud="off"; SV.err=null}
    else if(code!=="quota_exceeded"&&code!=="resource-exhausted"&&!SV.retryT) SV.retryT=setTimeout(()=>{SV.retryT=0; cloudFlush()},4000+Math.random()*4000);
  }finally{
    SV.busy=false; updSave();
    if(SV.again){SV.again=false; if(SV.dirty.size||SV.dead.size) cloudFlush()}
  }
}
async function writeProject(pr){
  const json=JSON.stringify(pr), n=Math.max(1,Math.ceil(json.length/CHUNK)), rev=pr.updated||Date.now(), base=docId(pr.id);
  for(let k=1;k<n;k++) await SV.col.doc(base+".c"+k).set({kind:"chunk",pid:pr.id,rev,i:k,s:json.slice(k*CHUNK,(k+1)*CHUNK)});
  await SV.col.doc(base).set({kind:"project",pid:pr.id,name:pr.name,updated:rev,rev,n,s:json.slice(0,CHUNK)});
  const old=SV.parts[pr.id]||1; for(let k=n;k<old;k++) await SV.col.doc(base+".c"+k).delete();
  SV.parts[pr.id]=n;
}

async function iaConta(){

async function iaImagem(f){
  try{
    const bmp=await createImageBitmap(f), k=Math.min(1,1600/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas"); c.width=Math.round(bmp.width*k); c.height=Math.round(bmp.height*k);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height); bmp.close&&bmp.close();
    return {mimeType:"image/jpeg",data:c.toDataURL("image/jpeg",.85).split(",")[1]};
  }catch(_){
    if(!/^image\/(jpeg|png|webp|heic|heif)$/.test(f.type)) throw iaErr("image_rejected");
    const b=await new Promise((ok,bad)=>{const r=new FileReader(); r.onload=()=>ok(r.result); r.onerror=bad; r.readAsDataURL(f)});
    return {mimeType:f.type,data:String(b).split(",")[1]};
  }
}
// mensagens no jeito do claude.ai ({role,content}) → "contents" do Gemini (user/model, sem dois seguidos do mesmo lado)
function iaContents(msgs){
  const out=[];
  for(const m of msgs){
    const role=m.role==="assistant"?"model":"user", text=String(m.content||"");
    const last=out[out.length-1];
    if(last&&last.role===role) last.parts[0].text+="\n\n"+text; else out.push({role,parts:[{text}]});
  }
  return out;
}
const iaTexto=j=>((((j||{}).candidates||[])[0]||{}).content||{parts:[]}).parts.map(p=>p.text||"").join("");
async function iaPedir(contents,opts){
  opts=opts||{};
  if(!FB.user) throw iaErr("login");
  if(!online()) throw iaErr("network");
  if(Date.now()<IA.off) throw iaErr("off"); // o Firebase recusou há pouco (App Check ou IA desligada): espera 2 min sem gastar pedido do dia
  await iaConta();
  const model=IA_MODELOS[opts.modelTier]||IA_MODELOS.quick, stream=!!opts.onText;
  const body={contents,generationConfig:Object.assign({temperature:.4},opts.json?{responseMimeType:"application/json"}:{})};
  let res;
  try{ res=await fetch(IA_URL(model)+(stream?"streamGenerateContent?alt=sse":"generateContent"),{method:"POST",headers:await iaHeaders(),body:JSON.stringify(body),signal:opts.signal}) }
  catch(e){ if(e&&e.name==="AbortError") throw iaErr("cancelled"); throw iaErr("network",e&&e.message) }
  if(!res.ok){
    let msg=""; try{msg=JSON.stringify(await res.json())}catch(_){}
    console.warn("IA",res.status,msg);
    if(res.status===401||res.status===403) IA.off=Date.now()+120000;
    throw iaErr(res.status===429?"rate_limited":res.status===400&&/image|inline/i.test(msg)?"image_rejected":res.status===401||res.status===403?"off":"error",msg);
  }
  if(!stream){ const j=await res.json(); return iaTexto(j) }
  // resposta aos poucos (SSE): "data: {...}" por pedaço
  const rd=res.body.getReader(), dec=new TextDecoder(); let buf="", text="";
  try{
    for(;;){
      const {done,value}=await rd.read(); if(done) break;
      buf+=dec.decode(value,{stream:true});
      let i; while((i=buf.indexOf("\n"))>=0){
        const line=buf.slice(0,i).trim(); buf=buf.slice(i+1);
        if(!line.startsWith("data:")) continue;
        try{ text+=iaTexto(JSON.parse(line.slice(5))); opts.onText({text}) }catch(_){}
      }
    }
  }catch(e){ if(e&&e.name==="AbortError") throw Object.assign(iaErr("cancelled"),{text}); throw iaErr("network") }
  return text;
}

const liveOpts=()=>({bg:C.bg,minor:C.minor,major:C.major,axis:C.axis,ink:C.ink,grid:true,sel:true,selCol:C.acc,lws:1,fa:.5});

function resize(){

let rafQ=0;
function draw(){if(rafQ) return; rafQ=requestAnimationFrame(()=>{rafQ=0; drawNow()})}
function drawNow(){
  if(!CW) return;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  renderScene(ctx,view.s,view.x,view.y,CW,CH,liveOpts());
  const o=liveOpts(), acc=C.acc;
  if(!P.items.length&&!st){ // projeto vazio: uma dica discreta no meio da tela
    const lines=["Projeto vazio","Toque em Móvel para pôr um móvel pronto","ou desenhe com Linha e Retângulo"];
    ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillStyle=C.fg; ctx.globalAlpha=.5;
    lines.forEach((t,i)=>{ctx.font=`${i?400:600} ${i?13:15}px ${FONT}`; ctx.fillText(t,CW/2,CH/2-22+i*22)}); ctx.globalAlpha=1;
  }
  const pv=(pr)=>rp(ctx,pr,view.s,view.x,view.y,o,acc);
  // hover
  if(tool==="select"&&hoverId&&!sel.has(hoverId)){const it=byId(hoverId); if(it&&visible(it)){ctx.globalAlpha=.45; for(const pr of prims(it)) rp(ctx,pr,view.s,view.x,view.y,o,acc); ctx.globalAlpha=1}}

    ctx.setLineDash([4,3]); ctx.strokeStyle=acc; ctx.lineWidth=1;
    for(const it of selItems()){const b=itemBounds(it); if(!isFinite(b[0])) continue; const a=toS([b[0],b[1]]),z=toS([b[2],b[3]]); ctx.strokeRect(a[0]-4,a[1]-4,z[0]-a[0]+8,z[1]-a[1]+8)}
    ctx.setLineDash([]);
  }
  // pré-visualizações
  if(st){
    const last=st.pts?st.pts[st.pts.length-1]:null;
    if(st.tool==="line"&&last){pv({k:"line",a:last,b:st.cur,lw:1.4,dash:1}); labelAt(st.cur,`${fmtLU(dist(last,st.cur))}  ${num(angDeg(last,st.cur),0)}°`)}
    if(st.tool==="rect"&&last){const [x0,y0]=last,[x1,y1]=st.cur; pv({k:"poly",pts:[[x0,y0],[x1,y0],[x1,y1],[x0,y1]],close:1,lw:1.4,dash:1}); labelAt(st.cur,`${fmtL(Math.abs(x1-x0))} × ${fmtL(Math.abs(y1-y0))} ${P.unit}`)}
    if(st.tool==="circle"&&last){const r=dist(last,st.cur); pv({k:"circle",c:last,r,lw:1.4,dash:1}); pv({k:"line",a:last,b:st.cur,lw:1,dash:1}); labelAt(st.cur,`R ${fmtLU(r)}`)}
    if(st.tool==="measure"&&last){const b=st.result?st.result[1]:st.cur; pv({k:"line",a:last,b,lw:1.6}); labelAt(b,`${fmtLU(dist(last,b))}  Δx ${fmtL(Math.abs(b[0]-last[0]))}  Δy ${fmtL(Math.abs(b[1]-last[1]))}`)}
    if(st.tool==="dim"){
      if(st.stage===1) pv({k:"line",a:st.a,b:st.cur,lw:1,dash:1});
      else for(const pr of dimPrims(st.a,st.b,st.off||0,acc,P.textH,1)) pv(pr);
    }
    if(st.tool==="free"&&st.pts.length>1) pv({k:"path",pts:st.pts,lw:curLw});
    if(st.tool==="box"){
      const a=toS(st.a), b=toS(st.b), win=st.b[0]>=st.a[0];
      ctx.fillStyle=win?C.win:C.snap; ctx.globalAlpha=.08; ctx.fillRect(a[0],a[1],b[0]-a[0],b[1]-a[1]); ctx.globalAlpha=1;
      ctx.strokeStyle=win?C.win:C.snap; ctx.setLineDash(win?[]:[5,4]); ctx.lineWidth=1; ctx.strokeRect(a[0]+.5,a[1]+.5,b[0]-a[0],b[1]-a[1]); ctx.setLineDash([]);
    }

    const [x,y]=toS(snapMark.p); ctx.strokeStyle=C.snap; ctx.lineWidth=2; ctx.setLineDash([]); ctx.beginPath();

    else if(snapMark.kind==="center"||snapMark.kind==="quad") ctx.arc(x,y,6,0,Math.PI*2);

    ctx.stroke();
  }
}
function labelAt(w,txt){
  const [x,y]=toS(w); ctx.font=`600 12px ${FONT}`; const tw=ctx.measureText(txt).width;
  let lx=x+14, ly=y-30; if(lx+tw+12>CW) lx=x-tw-26; if(ly<56) ly=y+16;
  ctx.fillStyle=C.fg; ctx.globalAlpha=.9; roundRect(ctx,lx,ly,tw+12,22,6); ctx.fill(); ctx.globalAlpha=1;
  ctx.fillStyle=C.surf; ctx.textBaseline="middle"; ctx.textAlign="left"; ctx.fillText(txt,lx+6,ly+11);
}
function roundRect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
const angDeg=(a,b)=>{let d=Math.atan2(-(b[1]-a[1]),b[0]-a[0])*180/Math.PI; return d<0?d+360:d};

function fit(){
  const b=sceneBounds(); if(!CW) return;
  if(!b){view.s=3;view.x=CW/2;view.y=CH*.65;draw();return}
  const bw=Math.max(20,b[2]-b[0]), bh=Math.max(20,b[3]-b[1]);
  const padT=70, padB=70, padX=40;
  view.s=clamp(Math.min((CW-padX*2)/bw,(CH-padT-padB)/bh),.05,80);
  view.x=CW/2-(b[0]+bw/2)*view.s; view.y=padT+(CH-padT-padB)/2-(b[1]+bh/2)*view.s; draw();
}
function zoomAt(x,y,f){const ns=clamp(view.s*f,.05,80), wx=(x-view.x)/view.s, wy=(y-view.y)/view.s; view.s=ns; view.x=x-wx*ns; view.y=y-wy*ns; draw()}

/* encaixe */
function snapAt(w,base,shift,exclude){
  snapMark=null; const tol=(ptrTol>12?20:12)/view.s; let best=null;
  if(opt.osnap){
    for(const it of P.items){ if(!visible(it)||(exclude&&exclude.has(it.id))) continue;
      for(const pr of prims(it)){ if(!pr.snap) continue; for(const [pt,kind] of keyPts(pr)){const d=dist(pt,w); if(d<tol&&(!best||d<best.d||(d-best.d<1e-6&&kind==="end"))) best={p:pt,d,kind}} } }
  }
  if(best&&opt.grid&&ptrTol>12){const g=P.grid, gp=[Math.round(w[0]/g)*g,Math.round(w[1]/g)*g]; if(dist(gp,w)<best.d*.6) best=null}
  if(best){snapMark={p:best.p,kind:best.kind}; return [best.p[0],best.p[1]]}
  let p=[w[0],w[1]];
  const ortho=base&&(opt.ortho||shift);
  if(ortho){if(Math.abs(p[0]-base[0])>=Math.abs(p[1]-base[1])) p[1]=base[1]; else p[0]=base[0]}
  if(opt.grid){const g=P.grid; if(ortho){if(p[1]===base[1]) p[0]=Math.round(p[0]/g)*g; else p[1]=Math.round(p[1]/g)*g} else p=[Math.round(p[0]/g)*g,Math.round(p[1]/g)*g]; snapMark={p,kind:"grid"}}
  const lk=ptrTol>12?14:7;
  if(base&&!ortho){ if(Math.abs(p[1]-base[1])*view.s<lk) p[1]=base[1]; else if(Math.abs(p[0]-base[0])*view.s<lk) p[0]=base[0] }

}
function hitTest(w){
  const tol=ptrTol/view.s;
  for(let i=P.items.length-1;i>=0;i--){const it=P.items[i]; if(!editable(it)||it.t==="mod") continue; if(hitItem(it,w,tol)) return it}
  for(let i=P.items.length-1;i>=0;i--){const it=P.items[i]; if(editable(it)&&it.t==="mod"&&hitItem(it,w,tol)) return it}
  return null;
}

/* ===================== ponteiro ===================== */
const ptrs=new Map(); let pinch=null, panDrag=null, down=null, spaceDown=false;
const evPt=e=>{const r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]};
const lastPt=()=>st&&st.pts&&st.pts.length?st.pts[st.pts.length-1]:null;

cv.addEventListener("pointerdown",e=>{
  if(e.button===2) return;
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
  ptrs.set(e.pointerId,evPt(e));
  if(ptrs.size===2){ if(down){cancelDrag(); down=null} startPinch(); return }
  if(ptrs.size>2) return;
  ptrTol=tolFor(e);
  const sp=evPt(e), w=toW(sp[0],sp[1]);
  if(tool==="pan"||e.button===1||spaceDown){panDrag={sp,vx:view.x,vy:view.y}; cv.style.cursor="grabbing"; return}
  down={sp,w,moved:false,shift:e.shiftKey};
  onDown(w,e);
});
cv.addEventListener("pointermove",e=>{
  const sp=evPt(e); if(ptrs.has(e.pointerId)) ptrs.set(e.pointerId,sp); if(!down&&!ptrs.size) ptrTol=tolFor(e);
  if(pinch&&ptrs.size>=2){movePinch(); return}
  if(panDrag){view.x=panDrag.vx+sp[0]-panDrag.sp[0]; view.y=panDrag.vy+sp[1]-panDrag.sp[1]; draw(); return}
  const w=toW(sp[0],sp[1]); updCoords(w);
  if(down&&!down.moved&&Math.hypot(sp[0]-down.sp[0],sp[1]-down.sp[1])>6) down.moved=true;
  if(e.pointerType!=="mouse"&&!down) return;

});
function ptrUp(e){
  if(!ptrs.has(e.pointerId)) return; ptrs.delete(e.pointerId);
  if(pinch){if(ptrs.size<2) pinch=null; return}
  if(panDrag){panDrag=null; cv.style.cursor=""; return}
  if(!down) return; const d=down; down=null; const sp=evPt(e); onUp(toW(sp[0],sp[1]),d,e);
}
cv.addEventListener("pointerup",ptrUp);
cv.addEventListener("pointercancel",e=>{ptrs.delete(e.pointerId); if(down){cancelDrag(); down=null} pinch=null; panDrag=null; draw()});
cv.addEventListener("pointerleave",e=>{if(e.pointerType==="mouse"&&!down){snapMark=null; hoverId=null; draw()}});
cv.addEventListener("dblclick",()=>{if(st&&st.tool==="line") finishChain()});
cv.addEventListener("wheel",e=>{e.preventDefault(); const sp=evPt(e); zoomAt(sp[0],sp[1],Math.exp(-e.deltaY*(e.ctrlKey?.01:.0015)))},{passive:false});
cv.addEventListener("contextmenu",e=>{e.preventDefault(); if(st) finishChain()});

function startPinch(){const [a,b]=[...ptrs.values()]; pinch={d:Math.hypot(b[0]-a[0],b[1]-a[1]),c:[(a[0]+b[0])/2,(a[1]+b[1])/2],s:view.s,vx:view.x,vy:view.y}}
function movePinch(){
  const [a,b]=[...ptrs.values()]; if(!b) return;
  const d=Math.hypot(b[0]-a[0],b[1]-a[1]), c=[(a[0]+b[0])/2,(a[1]+b[1])/2];
  const ns=clamp(pinch.s*d/Math.max(1,pinch.d),.05,80), wx=(pinch.c[0]-pinch.vx)/pinch.s, wy=(pinch.c[1]-pinch.vy)/pinch.s;
  view.s=ns; view.x=c[0]-wx*ns; view.y=c[1]-wy*ns; draw();
}
function cancelDrag(){
  if(st&&(st.tool==="free"||st.tool==="box")) st=null;
  if(st&&st.fresh) st=null;
  if(down&&down.origAll&&down.moved){P.items=JSON.parse(down.origAll); touch()}
  updHUD(); draw();
}

function onDown(w,e){
  if(tool==="select"){
    const hit=hitTest(w);
    if(hit){
      if(e.shiftKey){sel.has(hit.id)?sel.delete(hit.id):sel.add(hit.id)} else if(!sel.has(hit.id)) sel=new Set([hit.id]);
      down.mode="move"; down.start=snapAt(w,null,false,sel); down.origAll=JSON.stringify(P.items);
    } else { if(!e.shiftKey) sel.clear(); down.mode="box"; st={tool:"box",a:w,b:w} }
    renderPanel(); updCtx(); draw(); return;
  }
  if(tool==="erase"){down.erased=false; eraseAt(w); return}
  if(tool==="free"){st={tool:"free",pts:[w]}; return}
  if(tool==="text") return;
  const p=snapAt(w,st&&st.tool!=="dim"?lastPt():null,e.shiftKey);
  if(tool==="measure"&&st&&st.result) st=null;
  if(tool==="dim"){
    if(!st) st={tool:"dim",a:p,cur:p,stage:1,fresh:true};
    else if(st.stage===1){st.cur=p; st.fresh=false}
    else st.off=offFrom(w);
  } else if(["line","rect","circle","measure"].includes(tool)){
    if(!st) st={tool,pts:[p],cur:p,fresh:true}; else {st.cur=p; st.fresh=false}
  }
  updHUD(); draw();
}
function onMove(w,e){
  if(tool==="select"){
    if(down&&down.mode==="move"&&down.moved){
      const p=snapAt(w,null,false,sel); let dx=p[0]-down.start[0], dy=p[1]-down.start[1];
      if(e.shiftKey||opt.ortho){if(Math.abs(dx)>Math.abs(dy)) dy=0; else dx=0}
      const orig=JSON.parse(down.origAll); P.items=orig.map(it=>{if(sel.has(it.id)) translate(it,dx,dy); return it}); touch();
      showHUDRead(`Δx ${fmtL(dx)}  Δy ${fmtL(-dy)} ${P.unit}`);
    } else if(down&&down.mode==="box"&&st){st.b=w}
    else if(!down){const h=hitTest(w); const id=h?h.id:null; if(id!==hoverId){hoverId=id; draw()}; return}
    draw(); return;
  }
  if(tool==="erase"){if(down) eraseAt(w); return}
  if(tool==="free"){if(st&&down){const l=st.pts[st.pts.length-1]; if(dist(l,w)*view.s>1.5) st.pts.push(w); draw()} return}
  if(tool==="pan"||tool==="text"){snapMark=null; return}
  if(st&&st.tool==="dim"&&st.stage===2){st.off=offFrom(w); snapMark=null; draw(); return}
  const base=st&&st.tool!=="dim"?lastPt():(st&&st.tool==="dim"?st.a:null);
  const p=snapAt(w,base,e.shiftKey);
  if(st&&!st.result) st.cur=p;
  updHUD(); draw();
}
function offFrom(w){const a=st.a,b=st.b,L=dist(a,b); if(L<1e-9) return 0; const n=[-(b[1]-a[1])/L,(b[0]-a[0])/L]; return (w[0]-a[0])*n[0]+(w[1]-a[1])*n[1]}
function onUp(w,d,e){
  if(tool==="select"){
    if(d.mode==="move"){ if(d.moved){undoS.push(d.origAll); if(undoS.length>120) undoS.shift(); redoS=[]; afterEdit()} }
    else if(d.mode==="box"&&st){ if(d.moved) boxSelect(st.a,st.b,e.shiftKey); st=null; renderPanel(); updCtx() }
    showHUDRead(""); draw(); return;
  }
  if(tool==="erase") return;
  if(tool==="free"){ if(st&&st.pts.length>1) addItem({t:"free",pts:st.pts.map(p=>[+p[0].toFixed(2),+p[1].toFixed(2)])}); st=null; draw(); return }
  if(tool==="text"){ if(!d.moved) askText(snapAt(w,null,false)); return }
  if(!st) return;
  if(st.tool==="dim"){
    if(st.stage===1){ if(st.fresh&&!d.moved){st.fresh=false} else if(dist(st.a,st.cur)>1e-6){st.b=st.cur; st.stage=2; st.off=0} }
    else { addItem({t:"dim",a:st.a,b:st.b,off:+(st.off||0).toFixed(2),h:P.textH,lw:1}); st=null }
    updHUD(); draw(); return;
  }
  const a=st.pts[0];
  if(st.fresh&&!d.moved){st.fresh=false; updHUD(); draw(); return}
  if(st.tool==="line"){
    const last=lastPt();
    if(dist(last,st.cur)>1e-6){commitLine(last,st.cur); if(st.fresh){st=null} else {st.pts.push(st.cur)}}
    else if(st.fresh) st=null;
  }
  else if(st.tool==="rect"){ if(st.cur[0]!==a[0]&&st.cur[1]!==a[1]) addItem({t:"rect",a,b:st.cur}); st=null }
  else if(st.tool==="circle"){ const r=dist(a,st.cur); if(r>0) addItem({t:"circle",c:a,r:+r.toFixed(3)}); st=null }
  else if(st.tool==="measure"){ st.result=[a,st.cur] }
  updHUD(); draw();
}
function commitLine(a,b){addItem({t:"line",a:[+a[0].toFixed(3),+a[1].toFixed(3)],b:[+b[0].toFixed(3),+b[1].toFixed(3)]})}
function finishChain(){st=null; snapMark=null; updHUD(); draw()}
function closeChain(){if(st&&st.tool==="line"&&st.pts.length>2){commitLine(lastPt(),st.pts[0]); finishChain()}}
function boxSelect(a,b,add){
  const win=b[0]>=a[0], r=[Math.min(a[0],b[0]),Math.min(a[1],b[1]),Math.max(a[0],b[0]),Math.max(a[1],b[1])];
  if(!add) sel.clear();
  for(const it of P.items){ if(!editable(it)) continue; const bb=itemBounds(it); if(!isFinite(bb[0])) continue;
    const inside=bb[0]>=r[0]&&bb[2]<=r[2]&&bb[1]>=r[1]&&bb[3]<=r[3];
    const cross=bb[0]<=r[2]&&bb[2]>=r[0]&&bb[1]<=r[3]&&bb[3]>=r[1];
    if(win?inside:cross) sel.add(it.id) }
}
function eraseAt(w){
  const tol=ptrTol/view.s; const hit=P.items.filter(it=>editable(it)&&hitItem(it,w,tol));
  if(!hit.length) return;
  const ids=new Set(hit.slice(-1).map(i=>i.id));
  if(!down.erased){pushUndo(); down.erased=true}
  P.items=P.items.filter(i=>!ids.has(i.id)); ids.forEach(id=>sel.delete(id)); touch(); save(); draw(); dirty3D=true;
}

/* entrada numérica (estilo linha de comando) */
const numIn=$("#numIn");
function applyNum(){
  const raw=numIn.value.trim(); numIn.value="";
  if(!st) return;
  if(st.tool==="line"){
    if(!raw){finishChain(); return}
    const [l,an]=raw.split("<"); const L=parseN(l)/U(); if(!(L>0)) return toast("Digite um comprimento, por exemplo 147 ou 147<90");
    const last=lastPt(); let dir;
    if(an!==undefined&&an!==""){const a=parseN(an)*Math.PI/180; dir=[Math.cos(a),-Math.sin(a)]}
    else {const v=[st.cur[0]-last[0],st.cur[1]-last[1]], d=Math.hypot(v[0],v[1]); dir=d>1e-9?[v[0]/d,v[1]/d]:[1,0]}
    const np=[last[0]+dir[0]*L,last[1]+dir[1]*L]; commitLine(last,np); st.pts.push(np); st.cur=np; st.fresh=false;
  } else if(st.tool==="rect"){
    const v=raw.split(/[x×*;\s]+/i).filter(Boolean).map(s=>parseN(s)/U());
    if(v.length<2||!(v[0]>0)||!(v[1]>0)) return toast("Digite largura x altura, por exemplo 60x80");
    const a=st.pts[0], sx=Math.sign(st.cur[0]-a[0])||1, sy=Math.sign(st.cur[1]-a[1])||-1;
    addItem({t:"rect",a,b:[a[0]+sx*v[0],a[1]+sy*v[1]]}); st=null;
  } else if(st.tool==="circle"){
    let r=parseN(raw.replace(/^d/i,""))/U(); if(/^d/i.test(raw)) r/=2; if(!(r>0)) return toast("Digite o raio, ou d e o diâmetro (d60)");
    addItem({t:"circle",c:st.pts[0],r}); st=null;
  } else if(st.tool==="dim"&&st.stage===2){
    const o=parseN(raw)/U(); if(!isFinite(o)) return; addItem({t:"dim",a:st.a,b:st.b,off:st.off<0?-Math.abs(o):Math.abs(o),h:P.textH,lw:1}); st=null;
  }
  updHUD(); draw();
}
numIn.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault(); applyNum()} else if(e.key==="Escape"){numIn.value=""; numIn.blur(); cancelTool()} e.stopPropagation()});

/* ===================== HUD, coordenadas, contexto ===================== */
const TOOLS=[
  ["select","Selecionar","V",'<path d="M5 3l14 8-6 2-2 6z"/>'],
  ["insert","Móvel","N",'<rect x="4" y="3" width="16" height="18" rx="1.5"/><path d="M12 3v18M9 11v2M15 11v2"/>'],
  "-",
  ["line","Linha","L",'<path d="M5 19 19 5"/><circle cx="5" cy="19" r="1.6"/><circle cx="19" cy="5" r="1.6"/>'],
  ["rect","Retâng.","R",'<rect x="4" y="6" width="16" height="12" rx="1"/>'],
  ["circle","Círculo","C",'<circle cx="12" cy="12" r="8"/><path d="M12 12h8"/>'],
  ["dim","Cota","D",'<path d="M4 7v10M20 7v10M4 12h16"/><path d="m6 10-2 2 2 2M18 10l2 2-2 2"/>'],
  ["text","Texto","T",'<path d="M5 6V4h14v2M12 4v16M9 20h6"/>'],
  "-",
  ["measure","Medir","M",'<path d="M3 17 17 3l4 4L7 21z"/><path d="m7 13 2 2M10 10l2 2M13 7l2 2"/>'],
  ["free","Lápis","P",'<path d="M4 20l1-4L16 5l3 3L8 19z"/><path d="M14 7l3 3"/>'],
  ["erase","Apagar","E",'<path d="M8 20h12"/><path d="m4 15 9-9 6 6-7 7H8z"/><path d="m9 10 6 6"/>'],
  ["pan","Mover vista","H",'<path d="M12 3v18M3 12h18"/><path d="m9 6 3-3 3 3M9 18l3 3 3-3M6 9l-3 3 3 3M18 9l3 3-3 3"/>']
];
const MSG={
  select:"Toque para selecionar, arraste para mover",
  line:["Linha: primeiro ponto","Próximo ponto ou digite o comprimento"],
  rect:["Retângulo: primeiro canto","Canto oposto ou digite L x A"],
  circle:["Círculo: centro","Raio: toque ou digite o valor"],
  dim:["Cota: primeiro ponto","Cota: segundo ponto","Posicione a linha de cota"],
  measure:["Medir: primeiro ponto","Medir: segundo ponto","Toque para medir de novo"],
  text:"Toque onde o texto vai ficar", free:"Desenhe à mão livre",
  erase:"Toque ou arraste sobre o que quer apagar", pan:"Arraste para mover a vista"
};
function buildRail(){
  $("#rail").innerHTML=TOOLS.map(t=>t==="-"?"<hr>":`<button class="tb${t[0]==="insert"?" cta":""}" data-tool="${t[0]}" aria-pressed="${t[0]===tool}" title="${t[1]} (${t[2]})" aria-label="${t[1]}"><svg class="i" viewBox="0 0 24 24">${t[3]}</svg><span class="tl">${t[1]}</span><kbd>${t[2]}</kbd></button>`).join("");
}
$("#rail").addEventListener("click",e=>{const b=e.target.closest("[data-tool]"); if(!b) return; const t=b.dataset.tool; if(t==="insert") return showInsert(); setTool(t)});
function setTool(t){
  if(st&&st.tool==="line"&&tool!==t) finishChain();
  tool=t; st=null; snapMark=null; hoverId=null;
  if(t!=="select"&&sel.size){sel.clear(); renderPanel()}
  $$("#rail [data-tool]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.tool===t));
  cv.className=t==="select"?"sel":t==="pan"?"pan":"";
  updHUD(); updCtx(); draw();
}
function cancelTool(){ if(st){st=null; updHUD(); draw()} else if(sel.size){sel.clear(); renderPanel(); updCtx(); draw()} else if(tool!=="select") setTool("select") }
let hudRead="";
function showHUDRead(t){hudRead=t; $("#rd").textContent=t}
function updHUD(){
  let m=MSG[tool], stage=0;
  if(st){ if(st.tool==="dim") stage=st.stage===2?2:(st.fresh?0:1); else if(st.tool==="measure") stage=st.result?2:(st.fresh?0:1); else stage=1 }
  if(st&&st.fresh&&st.tool!=="dim"&&st.tool!=="measure") stage=1;
  const msg=Array.isArray(m)?m[Math.min(stage,m.length-1)]:m;
  $("#msg").textContent=msg||"";
  const numOn=!!st&&["line","rect","circle"].includes(st.tool)||(st&&st.tool==="dim"&&st.stage===2);
  $("#numBox").hidden=!numOn;
  if(numOn) numIn.placeholder=st.tool==="line"?`comprimento (${P.unit})`:st.tool==="rect"?`L x A (${P.unit})`:st.tool==="circle"?`raio (${P.unit})`:`afastamento`;
  const btns=[];
  if(st&&st.tool==="line"&&st.pts.length>1) btns.push(`<button class="btn sm" data-h="done">Concluir</button>`);
  if(st&&st.tool==="line"&&st.pts.length>2) btns.push(`<button class="btn sm" data-h="close">Fechar</button>`);
  if(st&&st.tool!=="box") btns.push(`<button class="btn sm ghost" data-h="cancel">Cancelar</button>`);
  $("#hudBtns").innerHTML=btns.join("");
  if(!st) showHUDRead("");
}
$("#hudBtns").addEventListener("click",e=>{const h=e.target.closest("[data-h]")?.dataset.h; if(h==="done") finishChain(); if(h==="close") closeChain(); if(h==="cancel") cancelTool()});
function updCoords(w){$("#coords").textContent=`X ${fmtL(w[0])} · Y ${fmtL(-w[1])} ${P.unit}`}
const isNarrow=()=>matchMedia("(max-width:900px)").matches;
function modCard(m){
  const u=P.unit, f=v=>num(toU(v),u==="mm"?0:1), n=(m.secs||[]).length;
  return `<div class="ch"><div><b>${esc(m.name||"Móvel")}</b><small>${f(m.W)} × ${f(m.H)} × ${f(m.D)} ${u}${n?` · ${n} vão${n>1?"s":""}`:""}</small></div><button class="cx" data-c="close" aria-label="Fechar"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <div class="cdims">${[["W","Largura"],["H","Altura"],["D","Profund."]].map(([k,l])=>`<label>${l} (${u})<input class="in n" data-q="${k}" value="${toU(m[k])}" inputmode="decimal" enterkeyhint="done"></label>`).join("")}</div>
  <div class="cacts"><button data-c="edit" class="pri"><svg class="i" viewBox="0 0 24 24"><path d="M4 20l1-4L16 5l3 3L8 19z"/></svg>Editar</button><button data-c="3d"><svg class="i" viewBox="0 0 24 24"><path d="M12 3 4 7.5v9L12 21l8-4.5v-9z"/><path d="M4 7.5 12 12l8-4.5M12 12v9"/></svg>3D</button><button data-c="cor" aria-label="Cor do móvel"><span class="cdot" style="background:${finBg(FIN[m.ff]||FIN[0])}"></span>Cor</button><button data-c="dup" class="io" aria-label="Duplicar" title="Duplicar"><svg class="i" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg></button><button data-c="del" class="del io" aria-label="Excluir" title="Excluir"><svg class="i" viewBox="0 0 24 24"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/></svg></button></div>`;
}
function updCtx(){
  const c=$("#ctx"); if(!sel.size||tool!=="select"){c.hidden=true; c.classList.remove("mcard"); return}
  const items=selItems(), one=items.length===1?items[0]:null, conv=!items.some(i=>i.t==="mod")&&!!convCandidates();
  if(one&&one.t==="mod"&&isNarrow()){ if(c.contains(document.activeElement)&&document.activeElement.dataset.q) return; c.classList.add("mcard"); c.innerHTML=modCard(one); c.hidden=false; return }
  c.classList.remove("mcard");
  c.innerHTML=`${conv?`<button data-c="conv" class="go"><svg class="i" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="1.5"/><path d="M12 3v18M9.5 11v2M14.5 11v2"/></svg>Gerar móvel</button>`:""}<button data-c="edit" class="only-m"><svg class="i" viewBox="0 0 24 24"><path d="M4 20l1-4L16 5l3 3L8 19z"/></svg>Editar</button>
    ${one&&one.t==="mod"?`<button data-c="3d"><svg class="i" viewBox="0 0 24 24"><path d="M12 3 4 7.5v9L12 21l8-4.5v-9z"/><path d="M4 7.5 12 12l8-4.5M12 12v9"/></svg>3D</button>`:""}
    <button data-c="dup"><svg class="i" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg>Duplicar</button>
    ${items.some(i=>i.t!=="mod"&&i.t!=="text")?`<button data-c="rot"><svg class="i" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>Girar</button>`:""}
    <button data-c="del" class="del"><svg class="i" viewBox="0 0 24 24"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/></svg>Excluir</button>`;
  c.hidden=false;
}
$("#ctx").addEventListener("click",e=>{const a=e.target.closest("[data-c]")?.dataset.c; if(!a) return;
  if(a==="close"){sel.clear(); renderPanel(); updCtx(); draw(); return}
  if(a==="conv") return showConvert(); if(a==="edit") openPanel("props"); if(a==="cor") showFin(); if(a==="del") delSel(); if(a==="dup") dupSel(); if(a==="rot") rotSel(); if(a==="3d") setView("3d")});
$("#ctx").addEventListener("change",e=>{const k=e.target.dataset.q; if(!k) return; const one=selItems().length===1?selItems()[0]:null; if(!one||one.t!=="mod") return;
  const cm=parseN(e.target.value)/U(); if(!(cm>=10)){e.target.value=toU(one[k]); return toast("Use uma medida a partir de 10 cm")}
  pushUndo(); if(k==="H"){const bottom=one.y+one.H; one.H=cm; one.y=bottom-cm} else one[k]=cm; e.target.blur(); afterEdit()});
$("#ctx").addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.dataset.q){e.preventDefault(); e.target.blur()}});
addEventListener("resize",()=>{updCtx(); updSave()});
/* abre o painel já nas cores (acabamentos) do móvel */
function showFin(){openPanel("props"); const g=$("#pbody [data-fb]")?.closest(".grp"); if(g) requestAnimationFrame(()=>g.scrollIntoView({block:"start",behavior:"smooth"}))}
function delSel(){if(!sel.size) return; pushUndo(); P.items=P.items.filter(i=>!sel.has(i.id)); sel.clear(); afterEdit(); updCtx()}
function dupSel(){if(!sel.size) return; pushUndo(); const d=P.grid*2, ns=new Set();
  for(const it of selItems()){const c=JSON.parse(JSON.stringify(it)); c.id=uid(); if(c.t==="mod"){c.x+=c.W; c.name=c.name+" (cópia)"} else translate(c,d,d); P.items.push(c); ns.add(c.id)}
  sel=ns; afterEdit(); updCtx()}
function rotSel(){pushUndo(); for(const it of selItems()) rotate90(it); afterEdit()}

/* teclado */
addEventListener("keydown",e=>{
  if(openDlg){ if(e.key==="Escape") closeDlg(); return }
  const tag=(e.target.tagName||"").toLowerCase(); if(tag==="input"||tag==="textarea"||tag==="select") return;
  if(curView!=="draw") return;
  const k=e.key;
  if((e.ctrlKey||e.metaKey)&&k.toLowerCase()==="z"){e.preventDefault(); e.shiftKey?doRedo():doUndo(); return}
  if((e.ctrlKey||e.metaKey)&&k.toLowerCase()==="y"){e.preventDefault(); doRedo(); return}
  if((e.ctrlKey||e.metaKey)&&k.toLowerCase()==="d"){e.preventDefault(); dupSel(); return}
  if((e.ctrlKey||e.metaKey)&&k.toLowerCase()==="a"){e.preventDefault(); sel=new Set(P.items.filter(editable).map(i=>i.id)); renderPanel(); updCtx(); draw(); return}
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  if(k===" "){spaceDown=true; e.preventDefault(); return}
  if(k==="Escape"){if(H.open&&!st&&!sel.size) closeHelp(); else cancelTool(); return}
  if(k==="Delete"||k==="Backspace"){if(sel.size){e.preventDefault(); delSel()} return}
  if(k==="Enter"){if(st&&st.tool==="line") finishChain(); return}
  if(k==="F8"){e.preventDefault(); toggleOpt("ortho"); return}
  if(k==="F3"){e.preventDefault(); toggleOpt("osnap"); return}
  if(k==="F9"){e.preventDefault(); toggleOpt("grid"); return}
  if(st&&!$("#numBox").hidden&&/^[0-9.,<xd-]$/i.test(k)){numIn.focus(); numIn.value+=k; e.preventDefault(); return}
  const map={v:"select",l:"line",r:"rect",c:"circle",d:"dim",t:"text",m:"measure",p:"free",e:"erase",h:"pan"};
  if(map[k.toLowerCase()]) setTool(map[k.toLowerCase()]);
  else if(k.toLowerCase()==="n") showInsert();
  else if(k.toLowerCase()==="z") fit();
});
addEventListener("keyup",e=>{if(e.key===" ") spaceDown=false});

function toggleOpt(k){opt[k]=!opt[k]; $("#t"+{grid:"Grid",osnap:"Osnap",ortho:"Ortho"}[k]).setAttribute("aria-pressed",opt[k]); toast({grid:"Grade",osnap:"Encaixe em objetos",ortho:"Modo ortogonal"}[k]+(opt[k]?" ligado":" desligado"))}
$("#tInt").onclick=()=>setShowInt(!P.showInt,true);
$("#tGrid").onclick=()=>toggleOpt("grid"); $("#tOsnap").onclick=()=>toggleOpt("osnap"); $("#tOrtho").onclick=()=>toggleOpt("ortho");
$("#bFit").onclick=fit;
$("#tScale").onclick=()=>{const g=[1,5,10]; P.grid=g[(g.indexOf(P.grid)+1)%g.length]; updScale(); save(); draw(); renderPanel()};
function updScale(){$("#tScale").textContent=`□ ${P.unit==="mm"?P.grid*10+" mm":P.grid+" cm"}`}

/* ===================== painel lateral ===================== */
let ptab="props";
function openPanel(t){if(t) setPtab(t); $("#side").classList.add("open"); $("#bPanel").setAttribute("aria-pressed","true")}
function closePanel(){$("#side").classList.remove("open"); $("#bPanel").setAttribute("aria-pressed","false")}
$("#bPanel").onclick=()=>$("#side").classList.contains("open")?closePanel():openPanel();
$("#bClosePanel").onclick=closePanel;
$$("[data-ptab]").forEach(b=>b.onclick=()=>setPtab(b.dataset.ptab));
function setPtab(t){ptab=t; $$("[data-ptab]").forEach(b=>b.setAttribute("aria-selected",b.dataset.ptab===t)); renderPanel()}

const uIn=(k,v,extra="")=>`<div class="unit"><input class="in n" data-k="${k}" value="${v}" inputmode="decimal" ${extra}><em>${P.unit}</em></div>`;
const toU=cm=>P.unit==="mm"?Math.round(cm*10):+(+cm).toFixed(2);
function swatches(cur,key){
  return `<div class="sws">
    <button class="sw layer" data-${key}="layer" aria-pressed="${cur==="layer"}" title="Cor da camada" aria-label="Cor da camada"></button>
    ${INKS.map(([c,n])=>`<button class="sw${c==="auto"?" auto":""}" ${c!=="auto"?`style="background:${c}"`:""} data-${key}="${c}" aria-pressed="${cur===c}" title="${n}" aria-label="${n}"></button>`).join("")}
    <label class="sw custom" title="Outra cor"><input type="color" data-${key}c="1" value="${/^#/.test(cur)?cur:"#ff5a1f"}" aria-label="Escolher outra cor"></label>
  </div>`;
}
/* cores dos móveis (FIN); cur = -1 quando os móveis selecionados têm cores diferentes */
const finGrp=(lb,key,cur)=>`<div class="grp"><span class="lb">${lb}</span><div class="fin">${FIN.map((f,i)=>`<button style="background:${finBg(f)}" data-${key}="${i}" aria-pressed="${cur===i}" title="${f[0]}" aria-label="${f[0]}"></button>`).join("")}</div><span class="note">${FIN[cur]?.[0]||(cur<0?"Cores diferentes":"")}</span></div>`;
const sameFin=(mods,k)=>mods.every(m=>+m[k]===+mods[0][k])?+mods[0][k]:-1;
const LW=[[.8,"Fina"],[1.4,"Média"],[2.4,"Grossa"]];
const lwSeg=(cur,key)=>`<div class="seg">${LW.map(([v,n])=>`<button data-${key}="${v}" aria-pressed="${Math.abs((cur||1.4)-v)<.01}">${n}</button>`).join("")}</div>`;
const layerSel=(cur,k)=>`<select class="in" data-k="${k}">${P.layers.map(l=>`<option value="${l.id}"${l.id===cur?" selected":""}>${esc(l.name)}</option>`).join("")}</select>`;

function renderPanel(){
  const pb=$("#pbody");
  const one=selItems().length===1?selItems()[0]:null; if(!one||one.id!==intOpen.mid) intOpen={mid:null,i:-1};
  if(ptab==="layers"){pb.innerHTML=layersHTML(); return}
  const items=selItems();
  if(!items.length) pb.innerHTML=docHTML();
  else if(items.length>1) pb.innerHTML=multiHTML(items);
  else pb.innerHTML=itemHTML(items[0]);
}
function docHTML(){
  const mods=P.items.filter(i=>i.t==="mod").length;
  return `<div class="ph"><h3>Desenho</h3><span class="tag">${P.items.length} objetos</span></div>
  <div class="grp"><span class="lb">Ao desenhar</span>
    <div class="f"><span class="lb" style="text-transform:none;letter-spacing:0;font-weight:500">Camada atual</span>${layerSel(P.curLayer,"curLayer")}</div>
    <div class="f"><span class="note">Cor</span>${swatches(curCol,"cc")}</div>
    <div class="f"><span class="note">Espessura</span>${lwSeg(curLw,"clw")}</div>
  </div>
  <div class="grp"><span class="lb">Unidades e grade</span>
    <div class="seg">${["cm","mm"].map(u=>`<button data-unit="${u}" aria-pressed="${P.unit===u}">${u==="cm"?"Centímetros":"Milímetros"}</button>`).join("")}</div>
    <div class="r2">
      <label class="f"><span class="note">Grade</span><select class="in" data-k="grid">${[1,5,10].map(g=>`<option value="${g}"${g===P.grid?" selected":""}>${P.unit==="mm"?g*10+" mm":g+" cm"}</option>`).join("")}</select></label>
      <label class="f"><span class="note">Texto das cotas</span>${uIn("textH",toU(P.textH))}</label>
    </div>
  </div>
  <div class="grp"><span class="lb">Marcenaria</span>
    <p class="note">${mods?`${mods} móve${mods>1?"is":"l"} no projeto. Selecione um para editar vãos, portas, gavetas e acabamentos.`:"Insira um móvel paramétrico para gerar o 3D, a lista de peças, o plano de corte e o orçamento."}</p>
    <button class="btn pri" data-a="insert">Inserir móvel</button>
  </div>
  <div class="grp"><span class="lb">Ajuda</span>
    <p class="note">Tire dúvidas escrevendo do seu jeito, ou veja o passo a passo com imagens no guia.</p>
    <div class="row" style="justify-content:flex-start"><button class="btn pri" data-a="chat">Tirar dúvidas</button><a class="btn" href="https://claude.ai/artifact/LoxsKJPStynxu7bheZw574" target="_blank" rel="noopener" style="text-decoration:none;color:inherit">Abrir o guia</a></div>
  </div>
  <div class="grp"><span class="lb">Atalhos</span>
    <p class="note">V selecionar · L linha · R retângulo · C círculo · D cota · T texto · M medir · N móvel · Z ajustar · F8 orto · F3 encaixe · Enter conclui · Esc cancela. Na linha, digite <b>147</b> ou <b>147&lt;90</b> para comprimento e ângulo.</p>
  </div>`;
}
function multiHTML(items){
  const mods=items.filter(i=>i.t==="mod");
  return `<div class="ph"><h3>${items.length} objetos</h3><span class="tag">seleção</span></div>
  ${!items.some(i=>i.t==="mod")&&convCandidates()?convBlock():""}
  <label class="f"><span class="lb">Camada</span>${layerSel("", "mLayer").replace('<select','<select data-placeholder="1"').replace(">",">"+'<option value="" selected disabled>Mover para…</option>')}</label>
  ${mods.length?`${finGrp(`Acabamento da caixa${mods.length>1?` (${mods.length} móveis)`:""}`,"mfb",sameFin(mods,"fb"))}${finGrp(`Acabamento das frentes${mods.length>1?` (${mods.length} móveis)`:""}`,"mff",sameFin(mods,"ff"))}`:""}
  <div class="f"><span class="lb">${mods.length?"Cor das linhas":"Cor"}</span>${swatches("","mcol")}</div>
  <div class="f"><span class="lb">Espessura</span>${lwSeg(0,"mlw")}</div>
  <div class="row" style="justify-content:flex-start"><button class="btn" data-a="dup">Duplicar</button><button class="btn del" data-a="del">Excluir</button></div>`;
}
function itemHTML(it){
  const names={line:"Linha",rect:"Retângulo",circle:"Círculo",dim:"Cota",text:"Texto",free:"Traço livre",mod:"Móvel"};
  let body="";
  if(it.t==="line"){const L=dist(it.a,it.b); body=`<div class="r2"><label class="f"><span class="lb">Comprimento</span>${uIn("len",toU(L))}</label><label class="f"><span class="lb">Ângulo</span><div class="unit"><input class="in n" data-k="ang" value="${num(angDeg(it.a,it.b),2).replace(/\./g,"")}" inputmode="decimal"><em>°</em></div></label></div>
    <div class="r2"><label class="f"><span class="lb">Início X</span>${uIn("ax",toU(it.a[0]))}</label><label class="f"><span class="lb">Início Y</span>${uIn("ay",toU(-it.a[1]))}</label></div>`}
  if(it.t==="rect"){const w=Math.abs(it.b[0]-it.a[0]),h=Math.abs(it.b[1]-it.a[1]); body=`<div class="r2"><label class="f"><span class="lb">Largura</span>${uIn("rw",toU(w))}</label><label class="f"><span class="lb">Altura</span>${uIn("rh",toU(h))}</label></div><p class="note">Área ${num(w*h/10000,3)} m²</p>
    <label class="f"><span class="lb">Profundidade no 3D</span>${uIn("dep",toU(+it.dep||0))}</label>
    <p class="note">${+it.dep>0?(+it.dep<=5?"Aparece no 3D como painel e entra na lista de peças.":"Aparece no 3D como volume. Para ter portas, gavetas e peças, use Gerar móvel."):"0 = só linha na parede. Com profundidade, vira painel (até 5 cm, entra na lista de peças) ou volume no 3D."}</p>`}
  if(it.t==="circle") body=`<div class="r2"><label class="f"><span class="lb">Raio</span>${uIn("cr",toU(it.r))}</label><label class="f"><span class="lb">Diâmetro</span>${uIn("cd",toU(it.r*2))}</label></div>`;
  if(it.t==="dim") body=`<div class="kv"><span>Medida</span><b>${fmtLU(dist(it.a,it.b))}</b></div><div class="r2"><label class="f"><span class="lb">Afastamento</span>${uIn("off",toU(it.off||0))}</label><label class="f"><span class="lb">Altura do texto</span>${uIn("th",toU(it.h||P.textH))}</label></div>`;
  if(it.t==="text") body=`<label class="f"><span class="lb">Texto</span><textarea class="in" data-k="txt" rows="3">${esc(it.s)}</textarea></label><label class="f"><span class="lb">Altura do texto</span>${uIn("th",toU(it.h))}</label>`;
  if(it.t==="mod") return modHTML(it);

  if(d.lv&&one){pushUndo(); one.secs[+d.sec].lv=+d.lv; return afterEdit()}

  if(d.intopen!==undefined&&one){const i=+d.intopen; if(intOpen.mid===one.id&&intOpen.i===i) intOpen={mid:null,i:-1}; else {intOpen={mid:one.id,i}; setShowInt(true,true)} return renderPanel()}
  if(d.intpre&&one){const [i,k]=d.intpre.split(":").map(Number); pushUndo(); one.secs[i].int=JSON.parse(JSON.stringify(INT_PRESETS[k].z)); setShowInt(true); return afterEdit()}
  if(d.zadd!==undefined&&one){const sc=one.secs[+d.zadd]; pushUndo(); if(!Array.isArray(sc.int)||!sc.int.length) sc.int=[{t:"prat",h:0,n:sc.n===undefined||sc.n===""?1:(+sc.n||0)}]; sc.int.push({t:"prat",h:40,n:0}); setShowInt(true); return afterEdit()}
  if(d.zdel&&one){const [i,zi]=d.zdel.split(":").map(Number); pushUndo(); one.secs[i].int.splice(zi,1); if(!one.secs[i].int.length) delete one.secs[i].int; return afterEdit()}
  if(d.intclear!==undefined&&one){pushUndo(); delete one.secs[+d.intclear].int; return afterEdit()}
  if(d.fb!==undefined&&one){pushUndo(); one.fb=+d.fb; return afterEdit()}
  if(d.ff!==undefined&&one){pushUndo(); one.ff=+d.ff; return afterEdit()}
  if(d.mfb!==undefined){pushUndo(); selItems().forEach(i=>{if(i.t==="mod") i.fb=+d.mfb}); return afterEdit()}
  if(d.mff!==undefined){pushUndo(); selItems().forEach(i=>{if(i.t==="mod") i.ff=+d.mff}); return afterEdit()}
  if(d.dims!==undefined&&one){pushUndo(); one.dims=d.dims==="1"; return afterEdit()}
  if(d.cc!==undefined){curCol=d.cc; return renderPanel()}
  if(d.clw!==undefined){curLw=+d.clw; return renderPanel()}
  if(d.unit){P.unit=d.unit; touch(); save(); updScale(); renderPanel(); draw(); return}
  if(d.icol!==undefined&&one){pushUndo(); one.col=d.icol; return afterEdit()}
  if(d.ilw!==undefined&&one){pushUndo(); one.lw=+d.ilw; return afterEdit()}
  if(d.mcol!==undefined){pushUndo(); selItems().forEach(i=>i.col=d.mcol); return afterEdit()}
  if(d.mlw!==undefined){pushUndo(); selItems().forEach(i=>i.lw=+d.mlw); return afterEdit()}
  if(d.lcur){P.curLayer=d.lcur; save(); return renderPanel()}
  if(d.lvis){const l=layer(d.lvis); l.visible=!l.visible; if(!l.visible) selItems().filter(i=>i.layer===l.id).forEach(i=>sel.delete(i.id)); touch(); save(); draw(); updCtx(); dirty3D=true; return renderPanel()}
  if(d.llock){const l=layer(d.llock); l.locked=!l.locked; if(l.locked) selItems().filter(i=>i.layer===l.id).forEach(i=>sel.delete(i.id)); save(); updCtx(); draw(); return renderPanel()}
});
pb.addEventListener("input",e=>{
  const el=e.target;
  if(el.dataset.ccc){curCol=el.value; return}
  if(el.dataset.lcol){const l=layer(el.dataset.lcol); l.color=el.value; touch(); save(); draw(); return}

pb.addEventListener("change",e=>{
  const el=e.target, d=el.dataset, one=selItems().length===1?selItems()[0]:null;
  const v=parseN(el.value), cm=v/U();
  if(d.ccc){curCol=el.value; return renderPanel()}
  if(d.icolc&&one){pushUndo(); one.col=el.value; return afterEdit()}
  if(d.mcolc){pushUndo(); selItems().forEach(i=>i.col=el.value); return afterEdit()}
  if(d.lcol) return renderPanel();
  if(d.k==="curLayer"){P.curLayer=el.value; save(); return}
  if(d.k==="grid"){P.grid=+el.value; updScale(); save(); draw(); return}
  if(d.k==="textH"){if(cm>0){P.textH=cm; touch(); save(); draw()} return}
  if(d.k==="mLayer"){pushUndo(); selItems().forEach(i=>i.layer=el.value); return afterEdit()}
  if(d.zi&&one){
    const [i,zi]=d.zi.split(":").map(Number), z=one.secs[i].int[zi]; pushUndo();
    if(d.zk==="t"){z.t=el.value; if(el.value==="gavetas"){z.n=Math.max(1,+z.n||3); if(!(+z.h>0)) z.h=54} if(el.value==="cabide") delete z.n}
    if(d.zk==="h") z.h=el.value.trim()===""?0:Math.max(0,cm);
    if(d.zk==="n") z.n=clamp(Math.round(v)||0,0,z.t==="gavetas"?8:12);
    return afterEdit();
  }
  if(d.sec!==undefined&&one){
    const s=one.secs[+d.sec]; pushUndo();
    if(d.sk==="w") s.w=el.value.trim()===""?0:Math.max(0,cm);
    if(d.sk==="type"){const was=s.type; s.type=el.value; delete s.lv; if(el.value==="gavetas") s.n=Math.max(2,+s.n||3); else if(el.value==="pgav"){s.n=2; delete s.int} else if(s.n===undefined||was==="pgav") s.n=1}
    if(d.sk==="n"){s.n=clamp(Math.round(v)||0,0,isDrw(s)?8:12); delete s.hs}
    if(d.sk==="gh") s.gh=el.value.trim()===""?0:Math.max(0,cm);
    return afterEdit();
  }
  if(!one) return;
  const k=d.k; if(!k) return;
  pushUndo();
  if(k==="layer") one.layer=el.value;
  else if(k==="name") one.name=el.value.trim()||"Móvel";
  else if(k==="txt"){ if(el.value.trim()) one.s=el.value }
  else if(!isFinite(cm)) {undoS.pop(); return renderPanel()}
  else if(k==="len"&&cm>0){const L=dist(one.a,one.b)||1; const u=[(one.b[0]-one.a[0])/L,(one.b[1]-one.a[1])/L]; one.b=[one.a[0]+u[0]*cm,one.a[1]+u[1]*cm]}
  else if(k==="ang"){const L=dist(one.a,one.b), a=v*Math.PI/180; one.b=[one.a[0]+Math.cos(a)*L,one.a[1]-Math.sin(a)*L]}
  else if(k==="ax"){const dx=cm-one.a[0]; one.a=[one.a[0]+dx,one.a[1]]; one.b=[one.b[0]+dx,one.b[1]]}
  else if(k==="ay"){const dy=-cm-one.a[1]; one.a=[one.a[0],one.a[1]+dy]; one.b=[one.b[0],one.b[1]+dy]}
  else if(k==="rw"&&cm>0){const s=Math.sign(one.b[0]-one.a[0])||1; one.b=[one.a[0]+s*cm,one.b[1]]}
  else if(k==="rh"&&cm>0){const s=Math.sign(one.b[1]-one.a[1])||1; one.b=[one.b[0],one.a[1]+s*cm]}
  else if(k==="cr"&&cm>0) one.r=cm;
  else if(k==="cd"&&cm>0) one.r=cm/2;
  else if(k==="off") one.off=cm;
  else if(k==="dep"&&cm>=0) one.dep=+cm.toFixed(2);
  else if(k==="th"&&cm>0) one.h=cm;
  else if(["W","H","D"].includes(k)&&cm>=10){ if(k==="H"){const bottom=one.y+one.H; one.H=cm; one.y=bottom-cm} else one[k]=cm }
  else if(k==="plinth"&&cm>=0&&cm<one.H/2) one.plinth=cm;
  else if(k==="elev"&&cm>=0) one.y=-(cm+one.H);
  else {undoS.pop(); return renderPanel()}
  afterEdit();
});

const isOutline=i=>(i.t==="rect"||i.t==="line")&&i.layer!=="cotas"&&i.layer!=="anot";
const hasDrawing=()=>P.items.some(i=>isOutline(i)&&visible(i));
function convCandidates(){
  const items=selItems().filter(isOutline); if(!items.length) return null;

    const r=items[0], bx=[Math.min(r.a[0],r.b[0]),Math.min(r.a[1],r.b[1]),Math.max(r.a[0],r.b[0]),Math.max(r.a[1],r.b[1])], tol=.6;
    all=all.concat(P.items.filter(i=>i!==r&&editable(i)&&isOutline(i)&&(b=>b[0]>=bx[0]-tol&&b[2]<=bx[2]+tol&&b[1]>=bx[1]-tol&&b[3]<=bx[3]+tol)(itemBounds(i))));
  }
  const segs=[];
  for(const it of all){ if(it.t==="line") segs.push([it.a,it.b]); else {const [x0,y0]=it.a,[x1,y1]=it.b; segs.push([[x0,y0],[x1,y0]],[[x1,y0],[x1,y1]],[[x1,y1],[x0,y1]],[[x0,y1],[x0,y0]])} }
  const bb=[Infinity,Infinity,-Infinity,-Infinity];
  for(const sg of segs) for(const q of sg){bb[0]=Math.min(bb[0],q[0]);bb[1]=Math.min(bb[1],q[1]);bb[2]=Math.max(bb[2],q[0]);bb[3]=Math.max(bb[3],q[1])}
  const W=bb[2]-bb[0], H=bb[3]-bb[1]; if(!(W>=15&&H>=15)) return null;
  // precisa de um contorno: as quatro bordas desenhadas
  const tol=Math.max(.6,Math.min(W,H)*.012);
  const cover=(fix,ax,v,lo,hi)=>{let len=0; for(const [a,b] of segs){ if(Math.abs(a[fix]-v)<tol&&Math.abs(b[fix]-v)<tol){const s0=Math.max(lo,Math.min(a[ax],b[ax])),s1=Math.min(hi,Math.max(a[ax],b[ax])); if(s1>s0) len+=s1-s0} } return len>=(hi-lo)*.8};
  if(!(cover(0,1,bb[0],bb[1],bb[3])&&cover(0,1,bb[2],bb[1],bb[3])&&cover(1,0,bb[1],bb[0],bb[2])&&cover(1,0,bb[3],bb[0],bb[2]))) return null;

}
function analyzeConv(c){
  const {segs,bb,W,H,tol}=c;

  const V=[],Hs=[];
  for(const [a,b] of segs){ if(onEdge(a,b)) continue; const dx=Math.abs(b[0]-a[0]),dy=Math.abs(b[1]-a[1]);
    if(dx<=Math.max(tol,dy*.08)) V.push({x:(a[0]+b[0])/2,y0:Math.min(a[1],b[1]),y1:Math.max(a[1],b[1])});
    else if(dy<=Math.max(tol,dx*.08)) Hs.push({y:(a[1]+b[1])/2,x0:Math.min(a[0],b[0]),x1:Math.max(a[0],b[0])}) }
  let plinth=0;
  for(const h of Hs){const d=bb[3]-h.y; if(d>=3&&d<=20&&(h.x1-h.x0)>=.7*W) plinth=Math.max(plinth,d)}
  const top=bb[1], bottom=bb[3]-plinth;
  const xs=V.filter(v=>Math.min(v.y1,bottom)-Math.max(v.y0,top)>=.45*(bottom-top)&&v.x>bb[0]+3&&v.x<bb[2]-3).map(v=>v.x).sort((p,q)=>p-q);
  const div=[]; for(const x of xs) if(!div.length||x-div[div.length-1]>4) div.push(x);
  const bounds=[bb[0],...div,bb[2]], t=(+P.mat.caixa.t||18)/10, secs=[];
  for(let i=0;i<bounds.length-1;i++){
    const a=bounds[i], b=bounds[i+1], sw=b-a;
    const ys=[]; Hs.filter(h=>h.y>top+4&&h.y<bottom-4&&Math.min(h.x1,b)-Math.max(h.x0,a)>=.6*sw).map(h=>h.y).sort((p,q)=>p-q).forEach(y=>{if(!ys.length||y-ys[ys.length-1]>4) ys.push(y)});
    const inW=sw-(i===0?t:t/2)-(i===bounds.length-2?t:t/2);
    const edges=[bottom,...[...ys].sort((p,q)=>q-p),top], hs=[]; for(let j=0;j<edges.length-1;j++) hs.push(+(edges[j]-edges[j+1]).toFixed(1));
    secs.push(ys.length?(ys.length<=7?{w:+inW.toFixed(1),type:"gavetas",n:ys.length+1,hs}:{w:+inW.toFixed(1),type:"gavetas",n:8}):{w:+inW.toFixed(1),type:inW>65?"porta2":"porta",n:H>150?4:1});
  }

    D:kind==="armario"?55:kind==="aereo"?35:55,name:kind==="armario"?"Armário":kind==="aereo"?"Aéreo":"Balcão"};
}

function specToMods(spec){
  const list=(spec&&Array.isArray(spec.moveis)?spec.moveis:[]).slice(0,12), out=[];
  for(const v of list){

    const n=x=>{x=+x; return isFinite(x)&&x>0?x:0};
    let W=n(v.largura)||T.W, H=n(v.altura)||T.H, D=n(v.profundidade)||T.D;
    if(W>400||H>400||D>200){W/=W>400?10:1; H/=H>400?10:1; D/=D>200?10:1} // vieram em mm
    const secs=(Array.isArray(v.vaos)?v.vaos:[]).filter(s=>s&&SEC_OK.includes(s.tipo)).slice(0,8).map(s=>{
      const o={w:n(s.largura),type:s.tipo,n:Math.max(0,Math.round(+s.qtd||0))};
      if(o.type==="gavetas"&&!o.n) o.n=3; if(o.type==="pgav"&&!o.n) o.n=2;
      if((o.type==="correr"||o.type==="pgav")&&+s.folhas) o.lv=+s.folhas;
      if(o.w>200) o.w/=10; return o});
    const over={name:String(v.nome||T.name).slice(0,40),W:clamp(W,10,400),H:clamp(H,10,300),D:clamp(D,10,120),elev:Math.max(0,+v.altura_piso||0)};
    if(secs.length) over.secs=secs;
    if(v.rodape!==undefined&&isFinite(+v.rodape)) over.plinth=clamp(+v.rodape,0,30);
    out.push({tk,over});
  }
  return out;
}

      if(pr.k==="line") out.push(`<line x1="${k(pr.a[0])}" y1="${k(pr.a[1])}" x2="${k(pr.b[0])}" y2="${k(pr.b[1])}" stroke="${col(pr.col)}" stroke-width="${sw}"${dash}/>`);
      else if(pr.k==="poly"){const pts=pr.pts.map(p=>k(p[0])+","+k(p[1])).join(" "), fill=pr.fill?(pr.fill==="ink"?col(pr.col):pr.fill):"none"; out.push(`<${pr.close?"polygon":"polyline"} points="${pts}" fill="${fill}"${pr.fill&&pr.fill!=="ink"?' fill-opacity=".55"':""} stroke="${col(pr.col)}" stroke-width="${sw}"${dash}/>`)}
      else if(pr.k==="circle") out.push(`<circle cx="${k(pr.c[0])}" cy="${k(pr.c[1])}" r="${k(pr.r)}" fill="none" stroke="${col(pr.col)}" stroke-width="${sw}"/>`);
      else if(pr.k==="path") out.push(`<polyline points="${pr.pts.map(p=>k(p[0])+","+k(p[1])).join(" ")}" fill="none" stroke="${col(pr.col)}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"/>`);

        out.push(`<text x="${k(pr.p[0])}" y="${k(pr.p[1])}" font-size="${k(pr.h)}" font-family="Arial, sans-serif" fill="${col(pr.col)}" text-anchor="${anchor}" dominant-baseline="${bl}"${deg?` transform="rotate(${deg} ${k(pr.p[0])} ${k(pr.p[1])})"`:""}>${esc(pr.s)}</text>`)}

}

/* ===================== peças, corte e orçamento ===================== */
const MATS=[["caixa","Caixa"],["frente","Frentes"],["fundo","Fundos"]];
function allParts(){
  const mods=P.items.filter(i=>i.t==="mod"&&visible(i)); let parts=[]; const hw={hinge:0,slide:0,pull:0,rod:0,rodSup:0,track:0,perfil:0,push:0}, warns=[], holes=[];
  mods.forEach((m,mi)=>{const g=modGeom(m), L=String.fromCharCode(65+(mi%26))+(mi>=26?Math.floor(mi/26):"");
    g.parts.forEach((p,i)=>parts.push(Object.assign(p,{code:L+(i+1),mi}))); for(const k in hw) hw[k]+=g.hw[k]||0; holes.push(...g.holes.map(h=>Object.assign(h,{mi,mod:m.name,L}))); if(g.warn) warns.push(m.name+": "+g.warn)});
  const panels=P.items.filter(i=>i.t==="rect"&&visible(i)&&+i.dep>0&&+i.dep<=5);
  panels.forEach((r,i)=>{const w=Math.abs(r.b[0]-r.a[0])*10,h=Math.abs(r.b[1]-r.a[1])*10, L=Math.round(Math.max(w,h)), W=Math.round(Math.min(w,h));
    parts.push({mid:r.id,mod:"Desenho",name:`Painel ${num(+r.dep*10,0)} mm`,q:1,L,W,mat:"caixa",edge:2*(L+W)/1000,code:"P"+(i+1),mi:mods.length+i})});
  if(P.items.some(i=>i.t==="rect"&&visible(i)&&+i.dep>5)) warns.push("Retângulos com mais de 5 cm de profundidade aparecem no 3D, mas não entram na lista de peças. Para isso, use Gerar móvel.");
  return {parts,hw,warns,holes,mods,hasParts:mods.length+panels.length>0};
}
const planCache={key:"",res:null};
function cutPlans(A){
  const res={}, ins={};
  const S=P.sheet, UW=S.w-2*(+S.trim||0), UH=S.h-2*(+S.trim||0), fits=(L,W)=>(L<=UW&&W<=UH)||(W<=UW&&L<=UH);
  for(const [k] of MATS){const pieces=[]; A.parts.filter(p=>p.mat===k).forEach(p=>{for(let i=0;i<p.q;i++){
    if(fits(p.L,p.W)||k!=="fundo"){pieces.push({code:p.code,name:p.name,L:p.L,W:p.W,mi:p.mi}); continue}
    // fundo maior que a chapa: divide em partes iguais (a emenda fica atrás de uma prateleira ou divisória)
    let done=false; for(let n=2;n<=4&&!done;n++) for(const [L,W] of [[Math.ceil(p.L/n),p.W],[p.L,Math.ceil(p.W/n)]]) if(!done&&fits(L,W)){for(let j=1;j<=n;j++) pieces.push({code:p.code,name:`${p.name} (parte ${j}/${n})`,L,W,mi:p.mi}); done=true}
    if(!done) pieces.push({code:p.code,name:p.name,L:p.L,W:p.W,mi:p.mi});
  }}); ins[k]=pieces}
  const key=JSON.stringify([ins,P.sheet,MATS.map(([k])=>!!P.mat[k].grain)]);
  if(planCache.key===key) return planCache.res;
  for(const [k] of MATS) res[k]=ins[k].length?pack(ins[k],P.sheet,!!P.mat[k].grain):{sheets:[],over:[],util:0,area:0,offA:0};
  planCache.key=key; planCache.res=res; return res;
}
const modHue=i=>`hsl(${(i*67+24)%360} 62% 74%)`;
function sheetSVG(sh,S){
  const fs=Math.max(30,S.w/55);
  const offs=(sh.off||[]).map(o=>{const f=Math.min(fs*.8,o.h*.3,o.w/8); return `<g><rect class="off" x="${o.x}" y="${o.y}" width="${o.w}" height="${o.h}" vector-effect="non-scaling-stroke"><title>Sobra ${o.w}×${o.h}</title></rect>${f>=10?`<text class="offt" x="${o.x+o.w/2}" y="${o.y+o.h/2}" font-size="${f}" text-anchor="middle" dominant-baseline="middle">sobra ${o.w}×${o.h}</text>`:""}</g>`}).join("");
  return `<svg class="sheet-svg" viewBox="0 0 ${S.w} ${S.h}" role="img" aria-label="Chapa com ${sh.pieces.length} peças"><defs><pattern id="hatch" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="40" height="40" fill="none"/><path d="M0 0v40" stroke="currentColor" stroke-width="6" opacity=".18"/></pattern></defs><rect class="bg" x="0" y="0" width="${S.w}" height="${S.h}" vector-effect="non-scaling-stroke"/>${offs}${sh.pieces.map(p=>{
    const f=Math.min(fs,p.h*.42,p.w/(Math.max(p.code.length,3)*.62));
    const f2=Math.min(fs*.7,p.h*.24,p.w/9);
    return `<g><rect class="pc" x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" fill="${modHue(p.mi)}" vector-effect="non-scaling-stroke"><title>${esc(p.code+" "+p.name+" "+p.L+"×"+p.W)}</title></rect>${f>=12?`<text x="${p.x+p.w/2}" y="${p.y+p.h/2-(f2>=10?f2*.35:0)}" font-size="${f}" text-anchor="middle" dominant-baseline="middle" font-weight="600">${esc(p.code)}</text>`:""}${f2>=10?`<text x="${p.x+p.w/2}" y="${p.y+p.h/2+f*.55}" font-size="${f2}" text-anchor="middle" dominant-baseline="middle" opacity=".75">${p.L}×${p.W}</text>`:""}</g>`}).join("")}</svg>`;
}

  <div class="tiles">${tiles}

  </div>
  ${A.warns.length||over.length||splits.length?`<div class="card">${A.warns.map(x=>`<p class="warn">${esc(x)}</p>`).join("")}${over.length?`<p class="warn">Peças maiores que a chapa: ${esc(over.join(", "))}</p>`:""}${splits.length?`<p class="note">Fundo maior que a chapa foi dividido: ${esc(splits.join(", "))}. Faça a emenda atrás de uma prateleira ou divisória.</p>`:""}</div>`:""}
